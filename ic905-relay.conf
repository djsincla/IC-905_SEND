# ic905-relay — band → relay SEQUENCING map (user editable)
#
# One rule per line:   <relay>, <band>, <delay_ms>
#
#   <relay>     1-6   (relays 1-3 = board 1 / I2C 0x70, 4-6 = board 2 / 0x73)
#   <band>      2m 70cm 23cm 13cm 6cm 3cm   (or 144 430 1200 2400 5600 10g)
#               or  all   (matches every TX band)
#               Multiple bands: separate with '/'  e.g.  23cm/2m
#   <delay_ms>  milliseconds after the TX edge before this relay closes.
#               For a band list, give one delay (shared) or one per band
#               with '/'  e.g.  0/15   (23cm@0ms, 2m@15ms)
#
# Examples:
#   1, 23cm/2m, 0       relay 1 closes at 0 ms on both 23cm and 2m
#   2, 23cm/2m, 0/15    relay 2: 23cm at 0 ms, 2m at 15 ms
#
# On TX:  matching relays CLOSE in increasing delay order.
# On RX:  they OPEN in mirrored reverse order (last closed = first open),
#         with the same gaps:  off-offset = (max delay in set) - (this delay).
# Band change while keyed: ramps the old band down, then the new band up.
#
# A relay may appear on several lines (one per band it serves).
# A specific-band rule wins over an "all" rule for the same relay+band.
#
# Edit, then:  sudo systemctl restart ic905-relay
#
# ── Example: 23cm 3-relay sequence + an always-on PTT relay ──────────────
1, 23cm, 0      # board 1 relay 1 closes immediately on 23cm TX
2, 23cm, 10     # board 1 relay 2 closes 10 ms later
4, 23cm, 20     # board 2 relay 1 closes 20 ms later
3, all,  0      # board 1 relay 3 closes on ANY band TX (e.g. amp PTT)

# ── MQTT monitoring + control (optional) ────────────────────────────────
# Publishes band/TX/relay state (retained) and accepts relay commands.
# Topics:  ic905/band  ic905/tx  ic905/relay/<1-6>  ic905/relay/<1-6>/mode
#          ic905/state (JSON)  ic905/status (online/offline)
# Commands: ic905/cmd/relay/<N> = close|open|auto   ic905/cmd/mode = manual|auto
# Disabled unless mqtt_enable = 1. The installer sets up a local broker with
# a password and fills in real credentials here.
#
# mqtt_enable = 1
# mqtt_broker = 127.0.0.1
# mqtt_port   = 1883
# mqtt_prefix = ic905
# mqtt_user   = ic905
# mqtt_pass   = (set by installer)
#
# Home Assistant MQTT auto-discovery: publishes retained discovery JSON so HA
# auto-creates entities for every topic this service exposes. See
# home-assistant/README.md for the full integration walkthrough.
# mqtt_ha_discovery        = 1               # 0 to disable
# mqtt_ha_discovery_prefix = homeassistant   # HA's default; change only if you've changed yours
